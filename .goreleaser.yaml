project_name: oci2vm
before:
  hooks:
  - go mod tidy
  - go generate ./...
  - make completions
builds:
- main: ./cmd/oci2vm
  env:
  - CGO_ENABLED=0
  ldflags:
  - -s -w -X "github.com/jimyag/oci2vm.Image={{.Env.IMAGE}}" -X "github.com/jimyag/oci2vm.Version={{.Env.VERSION}}" -X "github.com/jimyag/oci2vm.BuildDate={{.CommitDate}}"
  goos:
  - linux
  - windows
  - darwin
  goarch:
  - amd64
  - arm64
checksum:
  name_template: 'checksums.txt'
signs:
- artifacts: all
  stdin: '{{ .Env.GPG_PASSWORD }}'
snapshot:
  name_template: "{{ .Env.VERSION }}"
release:
  prerelease: auto
  extra_files:
  - glob: LICENCE
  - glob: NOTICE
archives:
- name_template: '{{ .ProjectName }}_{{ .Env.VERSION }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}{{ with .Mips }}_{{ . }}{{ end }}{{ if not (eq .Amd64 "v1") }}{{ .Amd64 }}{{ end }}'
  files:
  - LICENCE
  - NOTICE
  - README.md
  - completions/*
changelog:
  sort: asc
  filters:
    exclude:
    - '^docs:'
    - '^test:'
    - '^tests:'
    - '^actions:'
    - '^Makefile:'
    - '^chore:'
    - '^goreleaser:'
