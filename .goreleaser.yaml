version: 2
project_name: oci2vm
before:
  hooks:
  - go mod tidy
  - go generate ./...
builds:
- main: ./cmd/oci2vm
  env:
  - CGO_ENABLED=0
  ldflags:
  - -s -w -X "github.com/jimyag/oci2vm.Image={{.Env.IMAGE}}" -X "github.com/jimyag/oci2vm.Version={{.Env.VERSION}}" -X "github.com/jimyag/oci2vm.BuildDate={{.CommitDate}}"
  goos:
  - linux
  - windows
  - darwin
  goarch:
  - amd64
  - arm64
checksum:
  name_template: 'checksums.txt'
snapshot:
  version_template: "{{ .Env.VERSION }}"
release:
  prerelease: auto
  extra_files:
  - glob: LICENCE
  - glob: NOTICE
archives:
# the release has the binaries themselves, next to LICENCE and NOTICE
- formats:
  - binary
  name_template: '{{ .Binary }}_{{ .Os }}_{{ .Arch }}'
changelog:
  sort: asc
  filters:
    exclude:
    - '^docs:'
    - '^test:'
    - '^tests:'
    - '^actions:'
    - '^Makefile:'
    - '^chore:'
    - '^goreleaser:'
