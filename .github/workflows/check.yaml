name: Check

on:
  push:
    branches: ["main"]
  merge_group:
  pull_request:
    branches: ["main"]

permissions:
  pull-requests: read
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # cmd/oci2vm/run embeds the sparsecat binaries that go generate builds
      - name: Generate
        run: go generate ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          only-new-issues: true
          args: ./...
